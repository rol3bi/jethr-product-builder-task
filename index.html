<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calcolatore RAL → Netto</title>
<style>
  :root {
    --ink: #0e1210;
    --paper: #ffffff;
    --surface: #f5f7f5;
    --line: #dde2dd;
    --muted: #52584f;
    --accent: #00c48c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 520px;
  }

  header {
    margin-bottom: 28px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    line-height: 1.15;
  }

  .sottotitolo {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
    max-width: 42ch;
  }

  .pannello {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
  }

  .preset {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .preset__campo label {
    position: static;
    width: auto;
    height: auto;
    overflow: visible;
    clip: auto;
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .preset__campo select {
    width: 100%;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #ebeeeb;
    color: var(--muted);
    appearance: none;
    cursor: not-allowed;
  }

  .campo {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  label {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  input[type="number"] {
    flex: 1;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, white);
  }

  button {
    font-size: 15px;
    font-weight: 700;
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #risultato {
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  #risultato[hidden] { display: none; }

  .riga {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 9px 4px;
    border-bottom: 1px dashed var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 14.5px;
  }

  .riga:last-child { border-bottom: none; }

  .riga__etichetta { color: var(--ink); }
  .riga__valore { font-weight: 600; }

  .riga--totale {
    background: var(--ink);
    border-bottom: none;
    border-radius: 12px;
    margin-top: 10px;
    padding: 14px 12px;
    font-size: 17px;
  }

  .riga--totale .riga__etichetta,
  .riga--totale .riga__valore {
    font-weight: 800;
    color: #fff;
  }

  .errore {
    color: #b3261e;
    font-size: 14px;
    padding: 4px;
  }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body>
  <main>
    <header>
      <h1>Da RAL a netto, in un calcolo tracciabile</h1>
      <p class="sottotitolo">
        Calcola il netto annuale e mensile a partire dalla RAL, con il dettaglio di ogni trattenuta.
      </p>
    </header>

    <div class="pannello">
      <div class="preset">
        <div class="preset__campo">
          <label for="contratto">Contratto</label>
          <select id="contratto" disabled>
            <option>Tempo indeterminato</option>
          </select>
        </div>
        <div class="preset__campo">
          <label for="residenza">Residenza</label>
          <select id="residenza" disabled>
            <option>Milano</option>
          </select>
        </div>
        <div class="preset__campo">
          <label for="agevolazioni">Agevolazioni</label>
          <select id="agevolazioni" disabled>
            <option>Nessuna</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label for="ral">RAL annua lorda in euro</label>
        <input type="number" id="ral" placeholder="es. 32000" min="0" step="500" />
        <button id="calcola">Calcola</button>
      </div>

      <div id="risultato" hidden></div>
    </div>

    <footer>
      Semplificazioni adottate e fonti dei dati fiscali: vedi README.md nel repository.
    </footer>
  </main>

  <script src="calcolo.js"></script>
  <script src="app.js"></script>
</body>
</html>
